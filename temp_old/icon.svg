<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="90" />
    </clipPath>
  </defs>
  
  <g clip-path="url(#iconClip)">
    <!-- Фон -->
    <rect width="512" height="512" fill="#14161A" />
    
    <!-- Сетка -->
    <g stroke="#22252B" stroke-width="1">
      <line x1="128" y1="0" x2="128" y2="512" />
      <line x1="256" y1="0" x2="256" y2="512" />
      <line x1="384" y1="0" x2="384" y2="512" />
      <line x1="0" y1="128" x2="512" y2="128" />
      <line x1="0" y1="256" x2="512" y2="256" />
      <line x1="0" y1="384" x2="512" y2="384" />
    </g>

    <!-- ТОЧНАЯ КОПИЯ С ФОТО -->
    <g stroke="#F97316" stroke-width="36" stroke-linecap="round">
      <line x1="105" y1="435" x2="395" y2="395" />
      <line x1="185" y1="345" x2="395" y2="295" />
      <line x1="255" y1="245" x2="395" y2="195" />
      <line x1="305" y1="145" x2="395" y2="95" />
    </g>
  </g>
</svg>
