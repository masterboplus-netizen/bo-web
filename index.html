<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бо 8.1</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
    <style>
        :root { --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --fg: #c9d1d9; --fg-dim: #8b949e; --accent: #007aff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 20px; }
        .header { display: flex; align-items: center; margin-bottom: 20px; gap: 15px; }
        .header h2 { margin: 0; font-size: 22px; }
        .back-btn { background: none; border: none; color: var(--accent); font-size: 16px; cursor: pointer; padding: 0; }
        
        /* Главный экран */
        .main-action { background: var(--accent); border-radius: 16px; padding: 30px 20px; text-align: center; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
        .main-action-title { font-size: 22px; font-weight: bold; color: white; margin-bottom: 8px; }
        .main-action-desc { font-size: 14px; color: rgba(255,255,255,0.8); }
        
        .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .quick-item { background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; }
        .q-icon { font-size: 28px; margin-bottom: 8px; }
        .q-title { font-size: 16px; font-weight: 500; }

        /* Объекты */
        .object-list { display: flex; flex-direction: column; gap: 15px; }
        .object-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px; padding: 15px; cursor: pointer; }
        .obj-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .obj-details { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .badge { color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        .budget { color: var(--fg-dim); }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .menu-item { background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; }
    
    /* Нижняя навигация */
    #bottom-nav {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: var(--bg2); border-top: 1px solid var(--border);
        display: none; /* Скрыта по умолчанию */
        justify-content: space-around; padding: 10px 0;
        z-index: 100;
    }
    #bottom-nav.visible { display: flex; }
    .nav-item {
        display: flex; flex-direction: column; align-items: center;
        color: var(--fg-dim); font-size: 10px; cursor: pointer;
        text-decoration: none; gap: 4px;
    }
    .nav-item .nav-icon { width: 24px; height: 24px; }
    .nav-item.active { color: var(--accent); font-weight: bold; }
    body { padding-bottom: 60px; } /* Чтобы контент не прятался за панелью */

</style>
</head>
<body>
    
    <div id="app-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="icon-192.png" style="width: 36px; height: 36px; border-radius: 8px;">
            <h2 style="margin: 0; font-size: 22px;">Master Bo 7.1</h2>
        </div>
        <button class="back-btn" onclick="openSettings()" style="font-size: 24px; padding: 5px; color: var(--fg); cursor: pointer;">
            ⚙️
        </button>
    </div>
    <div id="app-content">Загрузка...</div>

    <nav id="bottom-nav">
        <div class="nav-item" onclick="renderMainMenu()" id="nav-main">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Главная</span>
        </div>
        <div class="nav-item" onclick="openObjects()" id="nav-objects">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V7l8-4 8 4v14"></path><path d="M9 21v-4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4"></path></svg>
            <span>Объекты</span>
        </div>
        <div class="nav-item" onclick="showStub('📋 Задачи')" id="nav-tasks">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span>Задачи</span>
        </div>
        <div class="nav-item" onclick="showStub('💰 Финансы')" id="nav-finance">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            <span>Финансы</span>
        </div>
        <div class="nav-item" onclick="showStub('👤 Личный кабинет')" id="nav-lk">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>ЛК</span>
        </div>
    </nav>
    

    <script src="app2.js?v=201"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js?v=99", { updateViaCache: "none" }).catch(function(){});
}
</script>
</body>
</html>
