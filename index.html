<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Bo 7.1</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
    <style>
        :root { --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --fg: #c9d1d9; --fg-dim: #8b949e; --accent: #007aff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 0; padding-bottom: 160px; }

        .header { display: flex; align-items: center; margin-bottom: 25px; gap: 15px; }
        .header h2 { margin: 0; font-size: 22px; }
        .back-btn { background: none; border: none; color: var(--accent); font-size: 16px; cursor: pointer; padding: 0; }

        .object-list { display: flex; flex-direction: column; gap: 15px; }
        .object-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px; padding: 15px; cursor: pointer; }
        .obj-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .obj-details { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .badge { color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        .budget { color: var(--fg-dim); }

        /* Нижняя навигация */
        #bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg2); border-top: 1px solid var(--bg3);
            z-index: 100; display: flex; flex-direction: column;
            height: 140px; /* Всегда два ряда */
            overflow: hidden;
        }

        /* Невидимая зона для свайпа вниз */
        #swipe-zone {
            position: absolute; top: 0; left: 0; right: 0; height: 30px; z-index: 105;
        }

        .nav-row {
            display: flex; width: 100%; height: 70px; flex-shrink: 0;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--fg-dim); font-size: 10px; cursor: pointer;
            text-decoration: none; gap: 4px; flex: 1;
        }
        .nav-item .nav-icon { width: 24px; height: 24px; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent); font-weight: bold; }

        /* Кнопка добавить (независимая) */
        .nav-add-btn {
            position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: white;
            width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.4);
            z-index: 105; cursor: pointer;
        }
        .nav-add-btn svg { width: 32px; height: 32px; }
        button { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div id="app-header" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 10px 20px; position: sticky; top: 0; background: var(--bg); z-index: 103;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="icon-192.png" onclick="renderMainMenu()" style="width: 36px; height: 36px; border-radius: 8px; cursor: pointer;">
            <h2 style="margin: 0; font-size: 22px; cursor: pointer;" onclick="renderMainMenu()">Master Bo 7.1</h2>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <div onclick="showStub('🔒 Блокировка')" style="border: 1px solid #30363d; border-radius: 8px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #161b22;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <div onclick="openSettings()" style="border: 1px solid #30363d; border-radius: 8px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #161b22;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
            <div onclick="showStub('👤 Личный кабинет')" style="border: 1px solid #30363d; border-radius: 8px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #161b22;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </div>
    </div>

    <div id="app-content" style="position: relative; z-index: 102; padding: 10px 20px;">Загрузка...</div>

    <!-- Кнопка добавить (висит всегда на одном месте) -->
    <div id="add-btn-floating" class="nav-add-btn" onclick="openAddMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </div>

    <nav id="bottom-nav">

        <div class="nav-row">
            <div class="nav-item" id="nav-personal" onclick="showStub('💸 Личные', 'personal')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg><span>Личные</span></div>
            <div class="nav-item" id="nav-objects" onclick="openObjects()"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"></path><path d="M5 21V7l8-4 8 4v14"></path><path d="M9 21v-4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4"></path></svg><span>Объекты</span></div>
            <div style="flex: 1;"></div>
            <div class="nav-item" id="nav-finance" onclick="openFinance()"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg><span>Финансы</span></div>
            <div class="nav-item" id="nav-tasks" onclick="showStub('📋 Задачи', 'tasks')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg><span>Задачи</span></div>
        </div>

        <div class="nav-row">
            <div class="nav-item" id="nav-diary" onclick="openDiary()"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg><span>Дневник</span></div>
            <div class="nav-item" id="nav-reports" onclick="showStub('📈 Отчёты', 'reports')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg><span>Отчёты</span></div>
            <div style="flex: 1;"></div>
            <div class="nav-item" id="nav-kpi" onclick="showStub('📊 KPI', 'kpi')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg><span>KPI</span></div>
            <div class="nav-item" id="nav-crm" onclick="showStub('👥 CRM', 'crm')"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>CRM</span></div>
        </div>
    </nav>

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("sw.js?v=107").catch(function(){});

</body>

</html>
