<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Bo 7.1</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">
    <style>
        :root { --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --fg: #c9d1d9; --fg-dim: #8b949e; --accent: #007aff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 20px; padding-bottom: 25px; }
        
        .header { display: flex; align-items: center; margin-bottom: 25px; gap: 15px; }
        .header h2 { margin: 0; font-size: 22px; }
        .back-btn { background: none; border: none; color: var(--accent); font-size: 16px; cursor: pointer; padding: 0; }

        .object-list { display: flex; flex-direction: column; gap: 15px; }
        .object-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px; padding: 15px; cursor: pointer; }
        .obj-title { font-size: 18px; font-weight: bold; margin-bottom: 25px; }
        .obj-details { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .badge { color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        .budget { color: var(--fg-dim); }

        /* Нижняя навигация */
        
        #bottom-nav.expanded { height: 170px; } /* Высота двух рядов */

        .nav-toggle-btn {
            height: 30px; width: 100%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; background: var(--bg2); flex-shrink: 0;
            color: var(--fg-dim); font-size: 18px; transition: transform 0.3s ease;
        }
        #bottom-nav.expanded .nav-toggle-btn { transform: rotate(180deg); }

        .nav-items-container { display: flex; flex-wrap: wrap; width: 100%; }
        
        .nav-item .nav-icon { width: 24px; height: 24px; margin-bottom: 25px; }
        .nav-item.active { color: var(--accent); font-weight: bold; }

        /* Кнопка добавить */
        .nav-add-btn {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: white;
            width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.4);
            z-index: 101; cursor: pointer; transition: bottom 0.3s ease;
        }
        
        .nav-add-btn svg { width: 32px; height: 32px; }
    </style>

    <style>
        .nav-item .nav-icon { width: 24px; height: 24px; }
        body { padding-bottom: 25px; /* Отступ, чтобы контент не прятался */ }
    </style>
</head>
<body>
    <div id="app-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="icon-192.png" onclick="renderMainMenu()" style="width: 36px; height: 36px; border-radius: 8px; cursor: pointer;">
            <h2 style="margin: 0; font-size: 22px; cursor: pointer;" onclick="renderMainMenu()">Master Bo 7.1</h2>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <div onclick="showStub('🔒 Блокировка')" style="border: 1px solid #30363d; border-radius: 8px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #161b22;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <div onclick="openSettings()" style="border: 1px solid #30363d; border-radius: 8px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #161b22;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
            <div onclick="showStub('👤 Личный кабинет')" style="border: 1px solid #30363d; border-radius: 8px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: #161b22;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </div>
    </div>
    
    <div id="app-content">Загрузка...</div>

    

    

    <script src="app2.js?v=402"></script>
    <script>
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("sw.js?v=99").catch(function(){});
        }
    </script>

    <div id="nav-overlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; display: none;" onclick="toggleMenu()"></div>

    <nav id="bottom-nav" style="position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg2); border-top: 1px solid var(--bg3); z-index: 100; display: flex; flex-direction: column; transform: translateY(0); transition: transform 0.3s ease;">
        
        
        <div id="nav-toggle" onclick="toggleNav()" style="height: 40px; width: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--accent); font-size: 14px; font-weight: bold; user-select: none;">
            ▲ Открыть меню
        </div>
    </nav>

    <script>
        function toggleNav() {
            const extraRow = document.getElementById('nav-extra-row');
            const toggleBtn = document.getElementById('nav-toggle');
            
            // Проверяем, открыто ли меню (виден ли нижний ряд)
            if (extraRow.style.display === 'flex') {
                extraRow.style.display = 'none';
                toggleBtn.innerHTML = '▲ Открыть меню';
            } else {
                extraRow.style.display = 'flex';
                toggleBtn.innerHTML = '▼ Закрыть меню';
            }
        }

        // Запрещаем выделение текста в меню (чтобы не было синих квадратов)
        document.querySelectorAll('.nav-item, .nav-toggle-btn, #nav-toggle').forEach(el => {
            el.style.userSelect = 'none';
            el.style.webkitUserSelect = 'none';
            el.style.webkitTouchCallout = 'none';
        });
    </script>

</body>
</html>
