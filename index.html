        :root { --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --fg: #c9d1d9; --fg-dim: #8b949e; --accent: #007aff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 20px; padding-bottom: 25px; }
        
        .header { display: flex; align-items: center; margin-bottom: 25px; gap: 15px; }
        .header h2 { margin: 0; font-size: 22px; }
        .back-btn { background: none; border: none; color: var(--accent); font-size: 16px; cursor: pointer; padding: 0; }

        .object-list { display: flex; flex-direction: column; gap: 15px; }
        .object-card { background: var(--bg2); border: 1px solid var(--bg3); border-radius: 12px; padding: 15px; cursor: pointer; }
        .obj-title { font-size: 18px; font-weight: bold; margin-bottom: 25px; }
        .obj-details { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .badge { color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        .budget { color: var(--fg-dim); }

        /* Нижняя навигация */
        
        #bottom-nav.expanded { height: 170px; } /* Высота двух рядов */

        .nav-toggle-btn {
            height: 30px; width: 100%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; background: var(--bg2); flex-shrink: 0;
            color: var(--fg-dim); font-size: 18px; transition: transform 0.3s ease;
        }
        #bottom-nav.expanded .nav-toggle-btn { transform: rotate(180deg); }

        .nav-items-container { display: flex; flex-wrap: wrap; width: 100%; }
        
        .nav-item .nav-icon { width: 24px; height: 24px; margin-bottom: 25px; }
        .nav-item.active { color: var(--accent); font-weight: bold; }

        /* Кнопка добавить */
        .nav-add-btn {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: white;
            width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.4);
            z-index: 101; cursor: pointer; transition: bottom 0.3s ease;
        }
        
        .nav-add-btn svg { width: 32px; height: 32px; }
    
        .edit-mode .nav-item {
            animation: shake 0.5s infinite;
            cursor: grab;
            position: relative;
        }
        .edit-mode .nav-item::after {
            content: '↕️'; position: absolute; top: 2px; right: 2px; font-size: 12px;
        }
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(2deg); }
            75% { transform: rotate(-2deg); }
            100% { transform: rotate(0deg); }
        }
</style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <script>
        let editMode = false;
        let longPressTimer;
        let sortableInstance = null;
        const container = document.querySelector('.nav-items-container'); // Берем верхний ряд (или общий)

        // Функция включения режима редактирования
        function enterEditMode() {
            if (editMode) return;
            editMode = true;
            document.body.classList.add('edit-mode');
            document.getElementById('edit-done-btn').style.display = 'block';
            
            // Делаем оба контейнера (верхний и нижний ряды) сортируемыми
            const containers = [
                document.querySelector('.nav-items-container'), // Верхний ряд
                document.getElementById('nav-extra-row')        // Нижний ряд
            ];

            containers.forEach(cont => {
                new Sortable(cont, {
                    group: 'nav-menu', // Позволяем перетаскивать между рядами
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    delay: 0, // В режиме редактирования тащим сразу
                    delayOnTouchOnly: false
                });
            });
        }

        // Функция выключения режима редактирования
        function exitEditMode() {
            editMode = false;
            document.body.classList.remove('edit-mode');
            document.getElementById('edit-done-btn').style.display = 'none';
            
            // Сохраняем новый порядок в localStorage
            const upperRow = document.querySelector('.nav-items-container');
            const lowerRow = document.getElementById('nav-extra-row');
            
            const upperOrder = Array.from(upperRow.children).map(el => el.innerHTML);
            const lowerOrder = Array.from(lowerRow.children).map(el => el.innerHTML);
            
            localStorage.setItem('bo_nav_upper', JSON.stringify(upperOrder));
            localStorage.setItem('bo_nav_lower', JSON.stringify(lowerOrder));
            
            // Перезагружаем для применения стилей
            location.reload();
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Восстанавливаем сохраненный порядок
            const savedUpper = localStorage.getItem('bo_nav_upper');
            const savedLower = localStorage.getItem('bo_nav_lower');
            
            if (savedUpper) {
                const upperRow = document.querySelector('.nav-items-container');
                upperRow.innerHTML = JSON.parse(savedUpper).join('');
            }
            if (savedLower) {
                const lowerRow = document.getElementById('nav-extra-row');
                lowerRow.innerHTML = JSON.parse(savedLower).join('');
            }

            // Обработка долгого нажатия (Long Press) для входа в режим
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('touchstart', (e) => {
                    longPressTimer = setTimeout(() => {
                        enterEditMode();
                    }, 600); // 600мс
                });
                item.addEventListener('touchend', () => clearTimeout(longPressTimer));
                item.addEventListener('touchmove', () => clearTimeout(longPressTimer));
            });

            // --- ЛОГИКА СВАЙПА ---
            const nav = document.getElementById('bottom-nav');
            const extraRow = document.getElementById('nav-extra-row');
            const hammer = new Hammer(nav);
            hammer.get('swipe').set({ direction: Hammer.DIRECTION_VERTICAL });
            
            hammer.on('swipeup', () => {
            });
            hammer.on('swipedown', () => {
            });
        });
    </script>
