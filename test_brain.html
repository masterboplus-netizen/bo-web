<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Тест MasterBoss Brain</title>
<style>body{font-family:monospace;background:#0d1117;color:#c9d1d9;padding:20px}textarea{width:100%;height:100px;background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;padding:10px;font-family:monospace}button{background:#238636;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;margin-top:10px}pre{background:#161b22;padding:15px;border-radius:6px;overflow-x:auto;white-space:pre-wrap}</style>
</head>
<body>
<h2>🧠 Тест MasterBoss Brain</h2>
<textarea id="input" placeholder="Введите фразу...">от левой стены 24, снизу 187, щиток 60×40</textarea><br>
<button id="btn">Разобрать</button>
<h3>Результат:</h3>
<pre id="output">Здесь будет JSON...</pre>
<script src="js/brain_engine.js"></script>
<script>
document.getElementById('btn').addEventListener('click', function() {
  try {
    var text = document.getElementById('input').value;
    var context = { object_id: 1, room_id: 5, user_id: 3, role: 'master' };
    var result = MasterBossBrain.plan(text, context);
    document.getElementById('output').textContent = JSON.stringify(result, null, 2);
  } catch (e) {
    document.getElementById('output').textContent = 'ОШИБКА: ' + e.message;
  }
});
</script>
</body>
</html>
